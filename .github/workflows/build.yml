name: Build

on: [push, pull_request]

jobs:
    MSVC:
        runs-on: windows-2022

        name: Windows MSVC

        steps:
          - uses: actions/checkout@v4
          - uses: ilammy/msvc-dev-cmd@v1
            with:
              arch: amd64

          # Windows has no usable system GoogleTest, so use the FetchContent copy.
          - name: Configure
            run: >
              cmake -S . -B build -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -Deirin_prefer_system_gtest=OFF

          - name: Build
            run: cmake --build build --verbose

          - name: Test
            run: ctest --test-dir build --output-on-failure

          - name: Benchmark
            run: ./build/bin/eirin_fixed.benchmark.exe

          - name: Benchmark (Vec Library)
            run: ./build/bin/eirin_fixed.tvec.benchmark.exe

          - name: Benchmark (Saturating Arithmetic)
            run: ./build/bin/eirin_fixed.sat_arith.benchmark.exe

          - name: Benchmark (For Compare)
            run: ./build/bin/double.benchmark.exe

    Clang:
        runs-on: ubuntu-24.04

        strategy:
          matrix:
            clang: [18]
          fail-fast: false
        name: Linux Clang ${{ matrix.clang }}

        steps:
          - name: Install Dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build clang-${{ matrix.clang }} libgtest-dev

          - uses: actions/checkout@v4

          - name: Configure
            run: >
              cmake -S . -B build -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }}

          - name: Build
            run: cmake --build build --verbose

          - name: Test
            run: ctest --test-dir build --output-on-failure

          - name: Benchmark
            run: ./build/bin/eirin_fixed.benchmark

          - name: Benchmark (Vec Library)
            run: ./build/bin/eirin_fixed.tvec.benchmark

          - name: Benchmark (Saturating Arithmetic)
            run: ./build/bin/eirin_fixed.sat_arith.benchmark

          - name: Benchmark (For Compare)
            run: ./build/bin/double.benchmark

    GCC:
        runs-on: ubuntu-24.04

        strategy:
          matrix:
            gcc: [13, 14]
          fail-fast: false
        name: Linux GCC ${{ matrix.gcc }}

        steps:
          - name: Install Dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} libgtest-dev

          - uses: actions/checkout@v4

          - name: Configure
            run: >
              cmake -S . -B build -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }}

          - name: Build
            run: cmake --build build --verbose

          - name: Test
            run: ctest --test-dir build --output-on-failure

          - name: Benchmark
            run: ./build/bin/eirin_fixed.benchmark

          - name: Benchmark (Vec Library)
            run: ./build/bin/eirin_fixed.tvec.benchmark

          - name: Benchmark (Saturating Arithmetic)
            run: ./build/bin/eirin_fixed.sat_arith.benchmark

          - name: Benchmark (For Compare)
            run: ./build/bin/double.benchmark

          - name: Install (header-only)
            if: matrix.gcc == 14
            run: |
              cmake --install build --prefix "$RUNNER_TEMP/eirin-install"
              test -f "$RUNNER_TEMP/eirin-install/include/eirin/eirin.hpp"
              printf '#include <eirin/fixed.hpp>\nint main() { return eirin::fixed32(1.5).internal_value() == 98304 ? 0 : 1; }\n' > "$RUNNER_TEMP/consumer.cpp"
              g++-14 -std=c++20 -I"$RUNNER_TEMP/eirin-install/include" "$RUNNER_TEMP/consumer.cpp" -o "$RUNNER_TEMP/consumer"
              "$RUNNER_TEMP/consumer"

    Emscripten:
        runs-on: ubuntu-24.04

        name: Emscripten

        steps:
          - name: Install Dependencies
            run: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build

          - uses: actions/checkout@v4
          - uses: mymindstorm/setup-emsdk@v14
            with:
              actions-cache-folder: emsdk-cache

          # The host GoogleTest is not usable for the wasm32 target, so use the
          # FetchContent copy.
          - name: Configure
            run: >
              emcmake cmake -S . -B build -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -Deirin_prefer_system_gtest=OFF

          - name: Build
            run: cmake --build build --verbose

          - name: Test
            run: node build/bin/eirin_fixed.test.js

          - name: Benchmark
            run: node build/bin/eirin_fixed.benchmark.js

          - name: Benchmark (Vec Library)
            run: node build/bin/eirin_fixed.tvec.benchmark.js

          - name: Benchmark (Saturating Arithmetic)
            run: node build/bin/eirin_fixed.sat_arith.benchmark.js

          - name: Benchmark (For Compare)
            run: node build/bin/double.benchmark.js
